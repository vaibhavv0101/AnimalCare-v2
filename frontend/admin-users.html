<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimalCare | User Management</title>
<link rel="stylesheet" href="css/style.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f8fb;color:#1f2937}
.navbar{min-height:72px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.logo{font-size:22px;font-weight:700;color:#f58220}
.nav-actions{display:flex;gap:10px;align-items:center}
.nav-actions button,.btn{border:0;cursor:pointer;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600}
.home-btn{background:#eef2f7;color:#374151}.logout-btn{background:#fee2e2;color:#b91c1c}
.container{max-width:1400px;margin:auto;padding:35px 25px 60px}
.header{margin-bottom:25px}.header span{color:#f58220;font-size:13px;font-weight:700;letter-spacing:1.5px}
.header h1{margin:7px 0;font-size:34px}.header p{margin:0;color:#6b7280}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:25px;box-shadow:0 6px 20px rgba(0,0,0,.04)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.count{font-weight:700}.refresh-btn{background:#f58220;color:#fff}
.table-wrapper{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 12px;text-align:left;border-bottom:1px solid #eef0f3;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#6b7280}td{font-size:14px}
.status,.role{display:inline-block;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600}
.active{background:#dcfce7;color:#166534}.inactive{background:#fee2e2;color:#991b1b}
.role{background:#eef2ff;color:#3730a3}
.action-btn{background:#eef2f7;color:#374151}.activate{background:#dcfce7;color:#166534}.deactivate{background:#fee2e2;color:#991b1b}
.role-select{padding:7px 9px;border:1px solid #d1d5db;border-radius:7px;background:#fff}
.loading,.empty,.error{padding:35px;text-align:center;color:#6b7280}.error{color:#b91c1c}
.current-admin{font-weight:600;color:#6b7280}
.verify-btn{background:#dcfce7;color:#166534}
.unverify-btn{background:#fee2e2;color:#991b1b}
@media(max-width:700px){.navbar{padding:0 15px}.container{padding:25px 15px 45px}.header h1{font-size:27px}.toolbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="navbar">
    <div class="logo">🐾 AnimalCare Admin</div>
    <div class="nav-actions">
        <button class="home-btn" id="dashboardBtn">Dashboard</button>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</header>

<main class="container">
    <div class="header">
        <span>ADMINISTRATION</span>
        <h1>👥 User Management</h1>
        <p>View and manage registered AnimalCare users and their roles.</p>
    </div>

    <section class="card">
        <div class="toolbar">
            <div class="count">Total Users: <span id="userCount">-</span></div>
            <button class="btn" id="addUserBtn">➕ Add User</button>
            <button class="btn refresh-btn" id="refreshBtn">🔄 Refresh</button>
        </div>
        <div id="addUserForm" style="display:none; margin-bottom:20px;">
    <h3>➕ Add New User</h3>

    <input type="text" id="newFullName" placeholder="Full Name" required>

    <input type="email" id="newEmail" placeholder="Email Address" required>

    <input type="text" id="newPhone" placeholder="Phone Number" required>

    <input type="password" id="newPassword" placeholder="Password" required>

    <select id="newRole" required>
        <option value="">Select Role</option>
        <option value="Adopter">Adopter</option>
        <option value="NGO">NGO</option>
        <option value="Veterinarian">Veterinarian</option>
        <option value="Volunteer">Volunteer</option>
    </select>

    <button type="button" class="btn" id="saveUserBtn">
        Create User
    </button>

    <button type="button" class="btn" id="cancelUserBtn">
        Cancel
    </button>

    <div id="addUserMessage"></div>
</div>
        <div id="usersTable" class="table-wrapper">
            <div class="loading">Loading users...</div>
        </div>
    </section>
</main>

<script src="js/api.js"></script>
<script>
const AVAILABLE_ROLES = [
    {id:1,name:"Admin"},
    {id:2,name:"NGO"},
    {id:3,name:"Volunteer"},
    {id:4,name:"Veterinarian"},
    {id:5,name:"Adopter"}
];

document.addEventListener("DOMContentLoaded", initializeUsersPage);

async function initializeUsersPage(){
    const token=getToken();
    const user=getCurrentUser();

    if(!token || !user){
        window.location.href="login.html";
        return;
    }

    const role=String(user.role||"").trim().toLowerCase();

    if(role!=="admin"){
        alert("Admin access required.");
        window.location.href="index.html";
        return;
    }

    await loadUsers();
}

async function loadUsers(){
    const container=document.getElementById("usersTable");
    container.innerHTML='<div class="loading">Loading users...</div>';

    try{
        const data=await apiRequest("/api/users/");
        const users=data.users||[];

        document.getElementById("userCount").textContent=data.count??users.length;

        if(!users.length){
            container.innerHTML='<div class="empty">No users found.</div>';
            return;
        }

        const currentAdminId=Number(getCurrentUser()?.id);

        container.innerHTML=`
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Name</th><th>Email</th><th>Phone</th>
                        <th>Role</th><th>Verified</th><th>Status</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${users.map(user=>{
                        const active=Boolean(user.is_active);
                        const isCurrentAdmin=Number(user.id)===currentAdminId;

                        return `
                        <tr>
                            <td>#${escapeHTML(user.id)}</td>
                            <td>${escapeHTML(user.full_name||"N/A")}</td>
                            <td>${escapeHTML(user.email||"N/A")}</td>
                            <td>${escapeHTML(user.phone||"N/A")}</td>
                            <td>
                                ${
                                    isCurrentAdmin
                                    ? `<span class="role">${escapeHTML(user.role||"Admin")}</span>`
                                    : `
                                    <select class="role-select"
                                        onchange="changeRole(${Number(user.id)}, this.value)">
                                        ${AVAILABLE_ROLES.map(role=>`
                                            <option value="${role.id}" ${Number(user.role_id)===role.id?"selected":""}>
                                                ${escapeHTML(role.name)}
                                            </option>
                                        `).join("")}
                                    </select>`
                                }
                            </td>
                            <td>
                                <span class="status ${user.is_verified?"active":"inactive"}">
                                    ${user.is_verified?"Verified":"Not Verified"}
                                </span>
                            </td>
                            <td>
                                <span class="status ${active?"active":"inactive"}">
                                    ${active?"Active":"Inactive"}
                                </span>
                            </td>
                            <td>
                                ${
                                    isCurrentAdmin
                                    ? '<span class="current-admin">Current Admin</span>'
                                    : `
                                    <button class="btn action-btn ${active?"deactivate":"activate"}"
                                        onclick="changeStatus(${Number(user.id)},${active})">
                                        ${active?"Deactivate":"Activate"}
                                    </button>
                                    <button class="btn ${user.is_verified?"unverify-btn":"verify-btn"}"
                                        onclick="changeVerification(${Number(user.id)},${Boolean(user.is_verified)})">
                                        ${user.is_verified?"Unverify":"Verify"}
                                    </button>`
                                }
                            </td>
                        </tr>`;
                    }).join("")}
                </tbody>
            </table>`;
    }catch(error){
        console.error("Users error:",error);
        container.innerHTML='<div class="error">Unable to load users.</div>';
    }
}

async function changeStatus(userId,currentStatus){
    const newStatus=!currentStatus;
    const action=newStatus?"activate":"deactivate";

    if(!confirm(`Are you sure you want to ${action} this user?`)) return;

    try{
        await apiRequest(`/api/users/${userId}/status`,{
            method:"PUT",
            body:JSON.stringify({is_active:newStatus})
        });
        alert(`User ${newStatus?"activated":"deactivated"} successfully.`);
        await loadUsers();
    }catch(error){
        console.error("Update status error:",error);
        alert(error.message||"Unable to update user status.");
        await loadUsers();
    }
}

async function changeRole(userId,roleId){
    const selectedRole=AVAILABLE_ROLES.find(role=>role.id===Number(roleId));
    if(!selectedRole) return;

    if(!confirm(`Change this user's role to ${selectedRole.name}?`)){
        await loadUsers();
        return;
    }

    try{
        await apiRequest(`/api/users/${userId}/role`,{
            method:"PUT",
            body:JSON.stringify({role_id:Number(roleId)})
        });

        alert("User role updated successfully.");
        await loadUsers();
    }catch(error){
        console.error("Update role error:",error);
        alert(error.message||"Unable to update user role.");
        await loadUsers();
    }
}

async function changeVerification(userId,currentStatus){
    const newStatus=!currentStatus;
    const action=newStatus?"verify":"unverify";

    if(!confirm(`Are you sure you want to ${action} this user?`)) {
        await loadUsers();
        return;
    }

    try{
        await apiRequest(`/api/users/${userId}/verification`,{
            method:"PUT",
            body:JSON.stringify({is_verified:newStatus})
        });

        alert(`User ${newStatus?"verified":"unverified"} successfully.`);
        await loadUsers();

    }catch(error){
        console.error("Update verification error:",error);
        alert(error.message||"Unable to update verification status.");
        await loadUsers();
    }
}

function escapeHTML(value){
    if(value===null||value===undefined) return "";
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

document.getElementById("refreshBtn").addEventListener("click",loadUsers);
document.getElementById("dashboardBtn").addEventListener("click",()=>window.location.href="admin-dashboard.html");
document.getElementById("logoutBtn").addEventListener("click",()=>logout());
// ===============================
// ADD NEW USER
// ===============================

const addUserBtn = document.getElementById("addUserBtn");
const addUserForm = document.getElementById("addUserForm");
const saveUserBtn = document.getElementById("saveUserBtn");
const cancelUserBtn = document.getElementById("cancelUserBtn");
const addUserMessage = document.getElementById("addUserMessage");

addUserBtn.addEventListener("click", () => {
    addUserForm.style.display = "block";
    addUserMessage.textContent = "";
});

cancelUserBtn.addEventListener("click", () => {
    addUserForm.style.display = "none";
    addUserMessage.textContent = "";
});

saveUserBtn.addEventListener("click", async () => {

    const full_name = document.getElementById("newFullName").value.trim();
    const email = document.getElementById("newEmail").value.trim();
    const phone = document.getElementById("newPhone").value.trim();
    const password = document.getElementById("newPassword").value;
    const role = document.getElementById("newRole").value;

    if (!full_name || !email || !phone || !password || !role) {
        addUserMessage.textContent = "Please fill in all fields.";
        return;
    }

    try {

        const response = await apiRequest("/api/users/", {
            method: "POST",
            body: JSON.stringify({
                full_name,
                email,
                phone,
                password,
                role
            })
        });

        addUserMessage.textContent = "User created successfully.";

        document.getElementById("newFullName").value = "";
        document.getElementById("newEmail").value = "";
        document.getElementById("newPhone").value = "";
        document.getElementById("newPassword").value = "";
        document.getElementById("newRole").value = "";

        await loadUsers();

        setTimeout(() => {
            addUserForm.style.display = "none";
            addUserMessage.textContent = "";
        }, 1000);

    } catch (error) {
        console.error("Create user error:", error);
        addUserMessage.textContent =
            error.message || "Unable to create user.";
    }
});
</script>
</body>
</html>
