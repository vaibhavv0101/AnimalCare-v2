<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AnimalCare</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7f6;
            padding: 20px;
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #198754;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
        }

        .login-link a {
            color: #198754;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="register-card">

    <h1>🐾 AnimalCare</h1>

    <p class="subtitle">
        Create your AnimalCare account
    </p>

    <form id="registerForm">

        <div class="form-group">
            <label>Full Name</label>
            <input
                type="text"
                id="fullName"
                required
            >
        </div>

        <div class="form-group">
            <label>Email</label>
            <input
                type="email"
                id="email"
                required
            >
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input
                type="tel"
                id="phone"
                required
            >
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                required
            >
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                required
            >
        </div>

        <div class="form-group">
            <label>Register As</label>

            <select id="role" required>
                <option value="">Select Role</option>
                <option value="Adopter">Adopter</option>
                <option value="Volunteer">Volunteer</option>
            </select>
        </div>

        <button type="submit">
            Create Account
        </button>

        <div id="message"></div>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

const form = document.getElementById("registerForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const fullName =
        document.getElementById("fullName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const role =
        document.getElementById("role").value;

    if (password !== confirmPassword) {
        message.style.color = "red";
        message.textContent = "Passwords do not match.";
        return;
    }

    message.style.color = "#555";
    message.textContent = "Creating account...";

    try {

        const response = await fetch(
            "http://127.0.0.1:5000/api/auth/register",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    full_name: fullName,
                    email: email,
                    phone: phone,
                    password: password,
                    role: role
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message ||
                "Registration failed."
            );
        }

        message.style.color = "green";
        message.textContent =
            "Account created successfully! Redirecting to login...";

        form.reset();

        setTimeout(function() {
            window.location.href = "login.html";
        }, 1500);

    } catch (error) {

        message.style.color = "red";
        message.textContent = error.message;
    }

});

</script>

</body>
</html>
