<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimalCare | Admin Analytics</title>
<link rel="stylesheet" href="css/style.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f8fb;color:#1f2937}
.navbar{min-height:72px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.logo{font-size:22px;font-weight:700;color:#f58220}
.nav-actions{display:flex;gap:10px}
.btn{border:0;cursor:pointer;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600}
.home-btn{background:#eef2f7;color:#374151}.logout-btn{background:#fee2e2;color:#b91c1c}.refresh-btn{background:#f58220;color:#fff}
.container{max-width:1400px;margin:auto;padding:35px 25px 60px}
.header{margin-bottom:28px}.header span{color:#f58220;font-size:13px;font-weight:700;letter-spacing:1.5px}
.header h1{margin:7px 0;font-size:34px}.header p{margin:0;color:#6b7280}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:25px}
.stat-card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.04)}
.stat-card{padding:22px}.stat-icon{font-size:28px}.stat-card h2{font-size:32px;margin:10px 0 4px}.stat-card p{margin:0;color:#6b7280}
.panels{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.panel{padding:24px}.panel h2{margin:0 0 18px;font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eef0f3}
.row:last-child{border-bottom:0}.label{font-weight:600}.value{font-weight:700}
.bar-wrap{width:55%;height:9px;background:#eef2f7;border-radius:10px;overflow:hidden}.bar{height:100%;background:#f58220;border-radius:10px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.loading,.error{padding:35px;text-align:center;color:#6b7280}.error{color:#b91c1c}

.charts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:20px}
.chart-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;box-shadow:0 6px 20px rgba(0,0,0,.04)}
.chart-card h2{margin:0 0 18px;font-size:20px}
.chart-box{position:relative;height:300px}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}
@media(max-width:600px){.charts-grid{grid-template-columns:1fr}}
@media(max-width:600px){.navbar{padding:0 15px}.container{padding:25px 15px 45px}.stats-grid{grid-template-columns:1fr}.header h1{font-size:27px}}
</style>
</head>
<body>

<header class="navbar">
    <div class="logo">🐾 AnimalCare Admin</div>
    <div class="nav-actions">
        <button class="btn home-btn" id="dashboardBtn">Dashboard</button>
        <button class="btn refresh-btn" id="refreshBtn">🔄 Refresh</button>
        <button class="btn logout-btn" id="logoutBtn">Logout</button>
    </div>
</header>

<main class="container">

    <div class="header">
        <span>ADMINISTRATION</span>
        <h1>📊 Analytics & Reports</h1>
        <p>Live overview of AnimalCare platform activity.</p>
    </div>

    <div id="content">
        <div class="loading">Loading analytics...</div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/api.js"></script>
<script>
document.addEventListener("DOMContentLoaded", initAnalytics);

async function initAnalytics(){
    const token=getToken();
    const user=getCurrentUser();

    if(!token || !user){
        window.location.href="login.html";
        return;
    }

    if(String(user.role||"").trim().toLowerCase()!=="admin"){
        alert("Admin access required.");
        window.location.href="index.html";
        return;
    }

    await loadAnalytics();
}

async function loadAnalytics(){
    const content=document.getElementById("content");
    content.innerHTML='<div class="loading">Loading analytics...</div>';

    try{
        const [usersData,animalsData,adoptionsData,rescuesData]=await Promise.all([
            apiRequest("/api/users/"),
            apiRequest("/api/animals/"),
            apiRequest("/api/adoptions/"),
            apiRequest("/api/rescues/")
        ]);

        const users=usersData.users||[];
        const animals=animalsData.animals||[];
        const adoptions=adoptionsData.adoptions||[];
        const rescues=rescuesData.rescues||[];

        const userRoles=countBy(users,"role");
        const animalStatus=countBy(animals,"adoption_status");
        const adoptionStatus=countBy(adoptions,"status");
        const rescueStatus=countBy(rescues,"status");
        const rescuePriority=countBy(rescues,"priority");

        const availableAnimals=animals.filter(a =>
            String(a.adoption_status||"").toLowerCase()==="available"
        ).length;

        const adoptedAnimals=animals.filter(a =>
            String(a.adoption_status||"").toLowerCase()==="adopted"
        ).length;

        content.innerHTML=`
            <div class="toolbar">
                <strong>Live Data</strong>
                <span>Updated: ${new Date().toLocaleString()}</span>
            </div>

            <div class="stats-grid">
                ${statCard("👥","Users",users.length)}
                ${statCard("🐕","Animals",animals.length)}
                ${statCard("🏠","Adoptions",adoptions.length)}
                ${statCard("🚑","Rescues",rescues.length)}
            </div>

            <div class="panels">
                ${makePanel("👥 User Roles",userRoles)}
                ${makePanel("🐕 Animal Status",{
                    Adopted:adoptedAnimals,
                    Available:availableAnimals
                })}
                ${makePanel("🏠 Adoption Status",adoptionStatus)}
                ${makePanel("🚑 Rescue Status",rescueStatus)}
                ${makePanel("⚡ Rescue Priority",rescuePriority)}
            </div>

            <div class="charts-grid">
                <section class="chart-card">
                    <h2>👥 User Roles</h2>
                    <div class="chart-box">
                        <canvas id="userRolesChart"></canvas>
                    </div>
                </section>

                <section class="chart-card">
                    <h2>🐕 Animal Adoption Status</h2>
                    <div class="chart-box">
                        <canvas id="animalStatusChart"></canvas>
                    </div>
                </section>

                <section class="chart-card">
                    <h2>🏠 Adoption Status</h2>
                    <div class="chart-box">
                        <canvas id="adoptionStatusChart"></canvas>
                    </div>
                </section>

                <section class="chart-card">
                    <h2>🚑 Rescue Status</h2>
                    <div class="chart-box">
                        <canvas id="rescueStatusChart"></canvas>
                    </div>
                </section>

                <section class="chart-card">
                    <h2>⚡ Rescue Priority</h2>
                    <div class="chart-box">
                        <canvas id="rescuePriorityChart"></canvas>
                    </div>
                </section>
            </div>
        `;

        createChart("userRolesChart","doughnut",userRoles);
        createChart("animalStatusChart","doughnut",{
            Adopted:adoptedAnimals,
            Available:availableAnimals
        });
        createChart("adoptionStatusChart","bar",adoptionStatus);
        createChart("rescueStatusChart","bar",rescueStatus);
        createChart("rescuePriorityChart","bar",rescuePriority);

    }catch(error){
        console.error("Analytics error:",error);
        content.innerHTML=`
            <div class="panel error">
                Unable to load analytics.<br>
                Please make sure the backend is running.
            </div>
        `;
    }
}

function createChart(canvasId,type,data){
    const canvas=document.getElementById(canvasId);
    if(!canvas || typeof Chart==="undefined") return;

    const labels=Object.keys(data);
    const values=Object.values(data);

    new Chart(canvas,{
        type:type,
        data:{
            labels:labels,
            datasets:[{
                label:"Count",
                data:values
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,
            plugins:{
                legend:{
                    display:type==="doughnut",
                    position:"bottom"
                }
            },
            scales:type==="bar" ? {
                y:{
                    beginAtZero:true,
                    ticks:{
                        precision:0
                    }
                }
            } : {}
        }
    });
}

function statCard(icon,label,value){
    return `
        <div class="stat-card">
            <div class="stat-icon">${icon}</div>
            <h2>${value}</h2>
            <p>${label}</p>
        </div>
    `;
}

function countBy(items,key){
    const result={};

    items.forEach(item=>{
        const value=String(item[key]||"Unknown").trim()||"Unknown";
        result[value]=(result[value]||0)+1;
    });

    return result;
}

function makePanel(title,data){
    const entries=Object.entries(data);

    if(!entries.length){
        return `
            <section class="panel">
                <h2>${title}</h2>
                <div class="loading">No data available.</div>
            </section>
        `;
    }

    const max=Math.max(...entries.map(([,value])=>value),1);

    return `
        <section class="panel">
            <h2>${title}</h2>

            ${entries.map(([label,value])=>`
                <div class="row">
                    <span class="label">${escapeHTML(label)}</span>

                    <div class="bar-wrap">
                        <div
                            class="bar"
                            style="width:${(value/max)*100}%">
                        </div>
                    </div>

                    <span class="value">${value}</span>
                </div>
            `).join("")}

        </section>
    `;
}

function escapeHTML(value){
    return String(value??"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

document.getElementById("refreshBtn")
    .addEventListener("click",loadAnalytics);

document.getElementById("dashboardBtn")
    .addEventListener("click",()=>{
        window.location.href="admin-dashboard.html";
    });

document.getElementById("logoutBtn")
    .addEventListener("click",()=>{
        logout();
    });
</script>

</body>
</html>
