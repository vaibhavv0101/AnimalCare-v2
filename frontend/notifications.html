<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications | AnimalCare</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5faf9;
            color: #1f2937;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #0f8f72;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            color: #1f2937;
            text-decoration: none;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #0f8f72;
        }

        .notification-link {
            position: relative;
        }

        .notification-badge {
            position: absolute;
            top: -12px;
            right: -14px;
            background: #dc2626;
            color: white;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        /* ================= PAGE ================= */

        .container {
            width: 86%;
            max-width: 1100px;
            margin: 45px auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #64748b;
        }

        .mark-all-btn {
            border: none;
            background: #0f9d76;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .mark-all-btn:hover {
            opacity: 0.9;
        }

        /* ================= SUMMARY ================= */

        .summary {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 22px;
        }

        .summary strong {
            color: #0f8f72;
        }

        /* ================= NOTIFICATIONS ================= */

        .notification-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .notification-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .notification-card.unread {
            border-left: 5px solid #0f9d76;
            background: #f0fdf8;
        }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .notification-message {
            color: #475569;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .notification-time {
            color: #94a3b8;
            font-size: 13px;
        }

        .read-btn {
            border: none;
            background: #0f9d76;
            color: white;
            padding: 8px 13px;
            border-radius: 7px;
            cursor: pointer;
            white-space: nowrap;
        }

        .read-status {
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }

        /* ================= STATES ================= */

        .state-box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 45px 20px;
            text-align: center;
            color: #64748b;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 800px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .notification-card {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <a href="index.html" class="logo">
        🐾 AnimalCare
    </a>

    <div class="nav-links">

        <a href="index.html">Home</a>

        <a href="animals.html">Animals</a>

        <a href="rescues.html">Rescues</a>

        <a href="my-requests.html">My Requests</a>

        <a href="notifications.html"
           class="notification-link">

            🔔 Notifications

            <span
                id="notificationBadge"
                class="notification-badge">
                0
            </span>

        </a>

    </div>

</nav>


<main class="container">

    <div class="page-header">

        <div>
            <h1>🔔 My Notifications</h1>

            <p>
                View updates about your AnimalCare requests.
            </p>
        </div>

        <button
            class="mark-all-btn"
            onclick="markAllAsRead()">

            ✓ Mark All as Read

        </button>

    </div>


    <div class="summary">

        Total Notifications:
        <strong id="totalCount">0</strong>

        &nbsp; | &nbsp;

        Unread:
        <strong id="unreadCount">0</strong>

    </div>


    <div
        id="notificationContainer"
        class="notification-list">

        <div class="state-box">
            Loading notifications...
        </div>

    </div>

</main>


<script src="js/api.js"></script>

<script>

    // ========================================================
    // ESCAPE HTML
    // ========================================================

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value ?? "";

        return div.innerHTML;
    }


    // ========================================================
    // LOAD NOTIFICATIONS
    // ========================================================

    async function loadNotifications() {

        const container =
            document.getElementById(
                "notificationContainer"
            );

        try {

            const response =
                await apiRequest(
                    "/api/notifications/"
                );

            const notifications =
                response.notifications || [];

            document.getElementById(
                "totalCount"
            ).textContent =
                notifications.length;


            if (notifications.length === 0) {

                container.innerHTML = `
                    <div class="state-box">
                        🔔 You do not have any notifications yet.
                    </div>
                `;

                await loadUnreadCount();

                return;
            }


            container.innerHTML =
                notifications
                    .map(createNotificationCard)
                    .join("");


            await loadUnreadCount();

        }

        catch (error) {

            console.error(
                "Unable to load notifications:",
                error
            );

            container.innerHTML = `
                <div class="state-box error">
                    Unable to load notifications.
                    Please try again.
                </div>
            `;
        }
    }


    // ========================================================
    // CREATE NOTIFICATION CARD
    // ========================================================

    function createNotificationCard(notification) {

        const isRead =
            notification.is_read === true;

        const title =
            notification.title ||
            "AnimalCare Notification";

        const message =
            notification.message ||
            "You have a new update.";

        const createdAt =
            notification.created_at ||
            "";

        return `
            <article
                class="notification-card
                ${isRead ? "" : "unread"}">

                <div class="notification-content">

                    <div class="notification-title">
                        ${escapeHtml(title)}
                    </div>

                    <div class="notification-message">
                        ${escapeHtml(message)}
                    </div>

                    <div class="notification-time">
                        ${escapeHtml(createdAt)}
                    </div>

                </div>

                <div>

                    ${
                        !isRead

                        ? `
                            <button
                                class="read-btn"
                                onclick="markAsRead(
                                    ${Number(notification.id)}
                                )">

                                Mark as Read

                            </button>
                        `

                        : `
                            <span class="read-status">
                                ✓ Read
                            </span>
                        `
                    }

                </div>

            </article>
        `;
    }


    // ========================================================
    // LOAD UNREAD COUNT
    // ========================================================

    async function loadUnreadCount() {

        try {

            const response =
                await apiRequest(
                    "/api/notifications/unread-count"
                );

            const count =
                Number(
                    response.unread_count || 0
                );


            document.getElementById(
                "unreadCount"
            ).textContent =
                count;


            const badge =
                document.getElementById(
                    "notificationBadge"
                );


            badge.textContent =
                count;


            if (count > 0) {

                badge.style.display =
                    "flex";

            } else {

                badge.style.display =
                    "none";
            }

        }

        catch (error) {

            console.error(
                "Unable to load unread count:",
                error
            );
        }
    }


    // ========================================================
    // MARK ONE AS READ
    // ========================================================

    async function markAsRead(notificationId) {

        try {

            await apiRequest(
                `/api/notifications/${notificationId}/read`,
                {
                    method: "PUT"
                }
            );


            await loadNotifications();

        }

        catch (error) {

            console.error(
                "Unable to mark notification as read:",
                error
            );

            alert(
                "Unable to mark notification as read."
            );
        }
    }


    // ========================================================
    // MARK ALL AS READ
    // ========================================================

    async function markAllAsRead() {

        try {

            const response =
                await apiRequest(
                    "/api/notifications/read-all",
                    {
                        method: "PUT"
                    }
                );


            await loadNotifications();


            alert(
                response.message ||
                "All notifications marked as read."
            );

        }

        catch (error) {

            console.error(
                "Unable to mark all notifications as read:",
                error
            );

            alert(
                "Unable to mark all notifications as read."
            );
        }
    }


    // ========================================================
    // START PAGE
    // ========================================================

    document.addEventListener(
        "DOMContentLoaded",
        async function () {

            console.log(
                "Notifications page started"
            );

            await loadNotifications();
        }
    );

</script>

</body>
</html>
